<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Usage</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; background: var(--surface); }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; }
  .spacer { flex: 1; }
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--panel); border-radius: 8px; }
  .seg button, .ghost {
    display: flex; align-items: center; gap: 6px;
    font: inherit; color: var(--ink-2); background: none; border: 0; border-radius: 6px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .seg button:hover, .ghost:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
  .ghost { border: 1px solid var(--line); }
  button:focus-visible { outline: 2px solid #3987e5; outline-offset: 1px; }

  main { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
  .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .notice { background: var(--panel); border-radius: 8px; padding: 10px 14px; color: var(--ink-2); line-height: 1.45; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border-radius: 10px; padding: 12px 14px; --label-w: 110px; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card-head b { font-weight: 600; }
  .card-head span { margin-left: auto; color: var(--ink-3); }
  .card p { margin: 4px 0 0; color: var(--ink-3); line-height: 1.4; }
  .connect { margin-top: 10px; color: var(--ink); }
  .connect:disabled { color: var(--ink-3); cursor: default; }

  .hero { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 40px; align-items: start; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sub { color: var(--ink-3); margin-top: 6px; }
  .rank { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .rank-row { display: grid; grid-template-columns: 10px 1fr auto; column-gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .rank-name { display: flex; align-items: center; gap: 6px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rank-sub { grid-column: 2 / 4; color: var(--ink-3); margin-top: 2px; }

  .chart-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .chart-head h2 { margin: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); margin-left: auto; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; }
  #chart { position: relative; height: 260px; }
  #chart svg { display: block; width: 100%; height: 100%; }
  #chart text { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  #chart .grid { stroke: var(--line); }
  #chart .hit { fill: transparent; }
  #chart .hit:hover { fill: var(--hover); }
  #hover {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 150px;
  }
  #hover b { display: block; margin-bottom: 4px; }
  #hover div { display: flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; }
  #hover div span:last-child { margin-left: auto; padding-left: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-3); display: grid; place-items: center; height: 100%; }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 18px 24px; }
  .totals div span { display: block; color: var(--ink-3); margin-bottom: 4px; }
  .totals div b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .table-head { display: flex; align-items: center; margin-bottom: 4px; }
  .table-head h2 { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font-weight: 400; color: var(--ink-3); padding: 8px 10px; }
  td { text-align: right; padding: 9px 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  td:first-child { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  td .muted, .muted { color: var(--ink-3); font-weight: 400; }
  footer { color: var(--ink-3); line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1 data-t>Usage</h1>
  <div class="seg" id="tabs"></div>
  <div class="spacer"></div>
  <div class="seg" id="metric">
    <button data-v="tokens" data-t>Tokens</button>
    <button data-v="cost" data-t>Cost</button>
  </div>
  <div class="seg" id="range">
    <button data-v="1" data-t>Today</button>
    <button data-v="7" data-t>7 days</button>
    <button data-v="30" data-t>30 days</button>
  </div>
  <button class="ghost" id="refresh" data-t>Refresh</button>
</header>
<main><div class="wrap" id="root"></div></main>
<script src="../i18n.js"></script>
<script src="common.js"></script>
<script src="report.js"></script>
</body>
</html>
