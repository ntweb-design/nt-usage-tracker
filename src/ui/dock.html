<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; background: transparent; overflow: hidden; }
  #dock {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px;
    background: var(--box-bg);
    /* The window itself is rounded and blurred by Windows; this only tints it. */
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: grab;
  }
  #items { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #dock.horizontal #items { flex-direction: row; }
  /* The box's name: small and quiet, above the rings. */
  #label {
    flex: none; width: 100%; height: 13px; margin-top: -3px;
    font-size: 9.5px; line-height: 12px; letter-spacing: 0.02em; text-align: center;
    color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  #label[hidden] { display: none; }
  #dock.dragging { cursor: grabbing; border-color: var(--box-border-strong); }
  .item {
    position: relative; flex: none; width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 50%;
    transition: background 0.12s;
  }
  .item:hover { background: var(--hover); }
  #dock.dragging .item:hover { background: none; }
  .item > svg.rings { position: absolute; inset: 3px; width: 40px; height: 40px; transform: rotate(-90deg); }
  .rings circle { fill: none; stroke-width: 3.2; }
  .rings .track { stroke: var(--track); }
  .rings .arc { stroke-linecap: round; transition: stroke-dashoffset 0.5s ease, stroke 0.3s; }
  .item .icon { position: relative; }
  .item.dim .icon { opacity: 0.4; }
  .item.dim .rings .track { stroke: var(--track-dim); }
  .badge {
    position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--badge-ring); box-sizing: content-box;
  }
</style>
</head>
<body>
<div id="dock"><div id="label" hidden></div><div id="items"></div></div>
<script src="../i18n.js"></script>
<script src="common.js"></script>
<script src="dock.js"></script>
</body>
</html>
